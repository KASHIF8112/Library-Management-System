<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Login Page */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 400px;
        }

        .login-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn-secondary {
            background: #ccc;
            color: #333;
        }

        .btn-secondary:hover {
            background: #bbb;
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background: #c53030;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        /* Dashboard */
        .dashboard {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
        }

        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .role-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .role-admin {
            background: #e53e3e;
            color: white;
        }

        .role-user {
            background: #48bb78;
            color: white;
        }

        /* Module Cards */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .module-card {
            background: #f7f9fc;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .module-card h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .module-card ul {
            list-style: none;
        }

        .module-card li {
            padding: 8px 0;
            color: #555;
        }

        /* Forms */
        .form-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-top: 20px;
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-group label, .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .error-messages {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error-messages.active {
            display: block;
        }

        .error-messages ul {
            margin-left: 20px;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.active {
            display: block;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-actions {
            margin-top: 20px;
            text-align: right;
        }

        /* Reports */
        .reports-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-top: 20px;
            display: none;
        }

        .reports-container.active {
            display: block;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .report-table th, .report-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .report-table th {
            background: #667eea;
            color: white;
        }

        .report-table tr:nth-child(even) {
            background: #f7f9fc;
        }

        /* Chart Link */
        .chart-link {
            text-align: right;
            margin-bottom: 20px;
        }

        .chart-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        /* Disabled inputs */
        input:disabled, select:disabled, textarea:disabled {
            background: #f0f0f0;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Login Page -->
        <div id="loginPage" class="login-container">
            <div class="login-box">
                <h2>📚 Library Management System</h2>
                <div id="loginError" class="error-messages"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="text" id="username" value="admin" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" value="admin" required>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button type="button" class="btn btn-secondary" onclick="clearLogin()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
                <div style="margin-top: 20px; text-align: center; font-size: 12px; color: #888;">
                    <a href="#" onclick="showInstructions(); return false;">📖 Instructions</a> | 
                    <a href="#" onclick="showChart(); return false;">📊 Chart</a> | 
                    <a href="#" onclick="fillAdminCredentials(); return false;">👑 Admin Login</a>
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" style="display: none;">
            <div class="dashboard">
                <div class="header">
                    <h1>📚 Library Management System</h1>
                    <div class="user-info">
                        <span class="role-badge" id="roleBadge"></span>
                        <span id="userName"></span>
                        <button class="btn btn-secondary" onclick="logout()">Logout</button>
                    </div>
                </div>
                
                <!-- Chart Link (optional - not required in working app per row 4) -->
                <div class="chart-link">
                    <a href="#" onclick="showChart(); return false;">📊 View System Chart</a>
                </div>

                <!-- Module Cards -->
                <div class="modules-grid" id="modulesGrid"></div>

                <!-- Forms Container -->
                <div id="formsContainer"></div>

                <!-- Reports Container -->
                <div id="reportsContainer" class="reports-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Mock Database
        let booksDB = [
            { id: 1, name: "The Great Gatsby", author: "F. Scott Fitzgerald", isbn: "978-0-7432-7356-5", available: true, quantity: 5, publisher: "Scribner", year: 1925, location: "A1" },
            { id: 2, name: "To Kill a Mockingbird", author: "Harper Lee", isbn: "978-0-06-112008-4", available: true, quantity: 3, publisher: "HarperCollins", year: 1960, location: "A2" },
            { id: 3, name: "1984", author: "George Orwell", isbn: "978-0-452-28423-4", available: false, quantity: 2, publisher: "Signet", year: 1949, location: "B1"},
            { id: 4, name: "The Alchemist", author: "Paulo Coelho", isbn: "375-0-244-763452-6", available: true, quantity: 2, publisher: "HarperCollins", year: 1988, location: "B3"},
            { id: 5, name: " The Story of My Experiments with Truth", author: "M.K. Gandhi", isbn: "453-0-765-875654-1", available: true, quantity: 1, publisher: " Navajivan Publishing House", year: 1925, location: "B4"},
            { id: 6, name: "Wings of Fire", author: "A.P.J. Abdul Kalam", isbn: "908-0-952-676478-1", available: true, quantity: 1, publisher: "Universities Press", year: 1999, location: "B2"
             }
        ];

        let membersDB = [
            { id: 1, membershipNo: "M1001", name: "Kashif Qamar", email: "kashif9858@gmail.com", phone: "1234567890", address: "New Delhi", plan: "6 months", expiryDate: "2026-10-21", active: true },
             { id: 2, membershipNo: "M1002", name: "Akash Kumar", email: "akumar87634@gmail.com", phone: "976534874", address: "Bihar", plan: "6 months", expiryDate: "2026-10-21", active: true },
              { id: 3, membershipNo: "M1003", name: "Hemant Rawat", email: "hemant674@gmail.com", phone: "887634574", address: "Uttar pradesh", plan: "6 months", expiryDate: "2026-10-21", active: true },
            { id: 4, membershipNo: "M1004", name: "Ansh Jadon ", email: "ansh8654@gmail.com", phone: "0987654321", address: "Noida sector-62", plan: "1 year", expiryDate: "2027-04-21", active: true }
        ];

        let transactionsDB = [
           
    { id: 3, bookName: "1984", author: "George Orwell", serialNo: "BK001", issueDate: "2026-04-21", returnDate: "2026-05-6", actualReturnDate: null, fine: 0, finePaid: false, status: "issued" },
    { id: 5, bookName: "The Story of My Experiments with Truth", author: "M.K. Gandhi", serialNo: "BK002", issueDate: "2026-04-25", returnDate: "2026-05-11", actualReturnDate: null, fine: 0, finePaid: false, status: "issued" }
        ];

        let usersDB = [
            { id: 1, username: "admin", password: "admin", role: "admin", name: "Admin User" },
            { id: 2, username: "user", password: "user", role: "user", name: "Regular User" }
        ];

        let currentUser = null;
        let currentTransaction = null;

        // Helper Functions
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Login Functions
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const user = usersDB.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                showDashboard();
            } else {
                showLoginError('Invalid credentials! Use admin/admin or user/user');
            }
        });

        function showLoginError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.innerHTML = `<ul><li>${escapeHtml(message)}</li></ul>`;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 3000);
        }

        function clearLogin() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function fillAdminCredentials() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin';
            showLoginError('✓ Admin credentials filled! Click Login to continue.');
            const errorDiv = document.getElementById('loginError');
            errorDiv.style.background = '#c6f6d5';
            errorDiv.style.color = '#22543d';
            setTimeout(() => {
                errorDiv.style.background = '';
                errorDiv.style.color = '';
            }, 2000);
        }

        function showInstructions() {
            alert(`📚 LIBRARY MANAGEMENT SYSTEM - INSTRUCTIONS

🔐 LOGIN:
• Admin: admin/admin (Full access)
• User: user/user (Limited access)

👥 USER ROLES:
ADMIN: Maintenance + Reports + Transactions
USER: Reports + Transactions only

📋 MODULES:
MAINTENANCE (Admin only): Add Book, User Management, Add/Update Membership
TRANSACTIONS: Issue Book, Return Book → Pay Fine
REPORTS: Issued/Returned Books, Fines, Active Members

⚠️ VALIDATION RULES:
• All required fields must be filled
• Issue Date cannot be before today
• Return Date auto 15 days ahead
• Fine: Rs. 10/day late`);
        }

        function logout() {
            currentUser = null;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('loginError').classList.remove('active');
        }

        function showDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('roleBadge').textContent = currentUser.role.toUpperCase();
            document.getElementById('roleBadge').className = `role-badge role-${currentUser.role}`;
            document.getElementById('userName').textContent = currentUser.name;
            renderModules();
        }

        function renderModules() {
            const modulesGrid = document.getElementById('modulesGrid');
            const canAccessMaintenance = currentUser.role === 'admin';
            
            let modulesHTML = '';
            
            if (canAccessMaintenance) {
                modulesHTML += `
                    <div class="module-card" onclick="showForm('maintenance')">
                        <h3>🔧 Maintenance</h3>
                        <ul>
                            <li>📖 Add Book</li>
                            <li>👥 User Management</li>
                            <li>➕ Add Membership</li>
                            <li>🔄 Update Membership</li>
                        </ul>
                    </div>
                `;
            }
            
            modulesHTML += `
                <div class="module-card" onclick="showReports()">
                    <h3>📊 Reports</h3>
                    <ul>
                        <li>📚 Issued Books Report</li>
                        <li>🔄 Returned Books Report</li>
                        <li>💰 Fines Collected Report</li>
                        <li>👥 Active Members Report</li>
                    </ul>
                </div>
                <div class="module-card" onclick="showForm('transactions')">
                    <h3>💳 Transactions</h3>
                    <ul>
                        <li>📖 Issue Book</li>
                        <li>🔄 Return Book</li>
                        <li>💰 Pay Fine</li>
                    </ul>
                </div>
            `;
            
            modulesGrid.innerHTML = modulesHTML;
        }

        function showForm(moduleType) {
            document.getElementById('reportsContainer').classList.remove('active');
            const formsContainer = document.getElementById('formsContainer');
            
            if (moduleType === 'maintenance') {
                formsContainer.innerHTML = getMaintenanceForms();
            } else if (moduleType === 'transactions') {
                formsContainer.innerHTML = getTransactionForms();
            }
            
            formsContainer.querySelectorAll('.form-container').forEach(container => {
                container.classList.add('active');
            });
            
            // Initialize date fields
            const today = new Date().toISOString().split('T')[0];
            const issueDateField = document.getElementById('issueDate');
            if (issueDateField) issueDateField.value = today;
        }

        function getMaintenanceForms() {
            return `
                <div id="addBookForm" class="form-container">
                    <h3 class="form-title">Add Book</h3>
                    <div id="addBookErrors" class="error-messages"></div>
                    <div id="addBookSuccess" class="success-message"></div>
                    <form onsubmit="submitAddBook(event)">
                        <div class="form-group">
                            <label>Type:</label>
                            <div class="radio-group">
                                <label><input type="radio" name="bookType" value="book" checked> Book</label>
                                <label><input type="radio" name="bookType" value="move"> Move</label>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Title *</label><input type="text" id="bookTitle" required></div>
                            <div class="form-group"><label>Author *</label><input type="text" id="bookAuthor" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>ISBN *</label><input type="text" id="bookISBN" required></div>
                            <div class="form-group"><label>Publisher *</label><input type="text" id="bookPublisher" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Year *</label><input type="number" id="bookYear" required></div>
                            <div class="form-group"><label>Quantity *</label><input type="number" id="bookQuantity" required></div>
                        </div>
                        <div class="form-group"><label>Location *</label><input type="text" id="bookLocation" required></div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideForms()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
                <div id="userManagementForm" class="form-container">
                    <h3 class="form-title">User Management</h3>
                    <div id="userMgmtErrors" class="error-messages"></div>
                    <div id="userMgmtSuccess" class="success-message"></div>
                    <form onsubmit="submitUserManagement(event)">
                        <div class="form-group">
                            <label>User Type:</label>
                            <div class="radio-group">
                                <label><input type="radio" name="userType" value="new" checked> New User</label>
                                <label><input type="radio" name="userType" value="existing"> Existing User</label>
                            </div>
                        </div>
                        <div class="form-group"><label>Name *</label><input type="text" id="userName" required></div>
                        <div id="existingUserFields" style="display: none;">
                            <div class="form-group"><label>User ID</label><input type="text" id="userId"></div>
                            <div class="form-group"><label>Role</label><select id="userRole"><option value="admin">Admin</option><option value="user">User</option></select></div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideForms()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
                <div id="addMembershipForm" class="form-container">
                    <h3 class="form-title">Add Membership</h3>
                    <div id="addMemberErrors" class="error-messages"></div>
                    <div id="addMemberSuccess" class="success-message"></div>
                    <form onsubmit="submitAddMembership(event)">
                        <div class="form-group"><label>Full Name *</label><input type="text" id="memberName" required></div>
                        <div class="form-group"><label>Email *</label><input type="email" id="memberEmail" required></div>
                        <div class="form-group"><label>Phone *</label><input type="text" id="memberPhone" required></div>
                        <div class="form-group"><label>Address *</label><textarea id="memberAddress" rows="3" required></textarea></div>
                        <div class="form-group">
                            <label>Membership Duration:</label>
                            <div class="radio-group">
                                <label><input type="radio" name="duration" value="6 months" checked> 6 months</label>
                                <label><input type="radio" name="duration" value="1 year"> 1 year</label>
                                <label><input type="radio" name="duration" value="2 years"> 2 years</label>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideForms()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
                <div id="updateMembershipForm" class="form-container">
                    <h3 class="form-title">Update Membership</h3>
                    <div id="updateMemberErrors" class="error-messages"></div>
                    <div id="updateMemberSuccess" class="success-message"></div>
                    <form onsubmit="submitUpdateMembership(event)">
                        <div class="form-group"><label>Membership Number *</label><input type="text" id="searchMemberNo" onchange="loadMemberDetails()" required></div>
                        <div id="memberDetails">
                            <div class="form-group"><label>Name</label><input type="text" id="displayMemberName" disabled></div>
                            <div class="form-group"><label>Current Plan</label><input type="text" id="displayCurrentPlan" disabled></div>
                            <div class="form-group"><label>Expiry Date</label><input type="text" id="displayExpiryDate" disabled></div>
                        </div>
                        <div class="form-group">
                            <label>Action:</label>
                            <div class="radio-group">
                                <label><input type="radio" name="action" value="extend" checked> Extend Membership (6 months)</label>
                                <label><input type="radio" name="action" value="cancel"> Cancel Membership</label>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideForms()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            `;
        }

        function getTransactionForms() {
            return `
                <div id="issueBookForm" class="form-container">
                    <h3 class="form-title">Issue Book</h3>
                    <div id="issueBookErrors" class="error-messages"></div>
                    <div id="issueBookSuccess" class="success-message"></div>
                    <form onsubmit="submitIssueBook(event)">
                        <div class="form-group"><label>Book Name *</label><input type="text" id="issueBookName" onchange="autoPopulateAuthor()" required></div>
                        <div class="form-group"><label>Author</label><input type="text" id="issueAuthor" disabled></div>
                        <div class="form-group"><label>Issue Date *</label><input type="date" id="issueDate" required></div>
                        <div class="form-group"><label>Return Date *</label><input type="date" id="returnDate"></div>
                        <div class="form-group"><label>Remarks</label><textarea id="issueRemarks" rows="3"></textarea></div>
                        <div class="checkbox-group"><label><input type="checkbox" id="bookAvailable"> Book Available (checked = yes)</label></div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideForms()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
                <div id="returnBookForm" class="form-container">
                    <h3 class="form-title">Return Book</h3>
                    <div id="returnBookErrors" class="error-messages"></div>
                    <div id="returnBookSuccess" class="success-message"></div>
                    <form onsubmit="submitReturnBook(event)">
                        <div class="form-group"><label>Book Name *</label><input type="text" id="returnBookName" onchange="autoPopulateReturnAuthor()" required></div>
                        <div class="form-group"><label>Author</label><input type="text" id="returnAuthor" disabled></div>
                        <div class="form-group"><label>Serial No *</label><input type="text" id="serialNo" required></div>
                        <div class="form-group"><label>Issue Date</label><input type="date" id="returnIssueDate" disabled></div>
                        <div class="form-group"><label>Return Date</label><input type="date" id="returnDateField"></div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideForms()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Confirm</button>
                        </div>
                    </form>
                </div>
                <div id="payFineForm" class="form-container">
                    <h3 class="form-title">Pay Fine</h3>
                    <div id="payFineErrors" class="error-messages"></div>
                    <div id="payFineSuccess" class="success-message"></div>
                    <form onsubmit="submitPayFine(event)">
                        <div class="form-group"><label>Book Name</label><input type="text" id="fineBookName" disabled></div>
                        <div class="form-group"><label>Author</label><input type="text" id="fineAuthor" disabled></div>
                        <div class="form-group"><label>Serial No</label><input type="text" id="fineSerialNo" disabled></div>
                        <div class="form-group"><label>Issue Date</label><input type="text" id="fineIssueDate" disabled></div>
                        <div class="form-group"><label>Return Date</label><input type="text" id="fineReturnDate" disabled></div>
                        <div class="form-group"><label>Fine Amount</label><input type="text" id="fineAmount" disabled></div>
                        <div class="checkbox-group"><label><input type="checkbox" id="finePaid"> Fine Paid (required if fine > 0)</label></div>
                        <div class="form-group"><label>Remarks</label><textarea id="fineRemarks" rows="3"></textarea></div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideForms()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Confirm Transaction</button>
                        </div>
                    </form>
                </div>
            `;
        }

        // Form Submission Handlers
        function submitAddBook(event) {
            event.preventDefault();
            const errors = [];
            const title = document.getElementById('bookTitle').value;
            const author = document.getElementById('bookAuthor').value;
            const isbn = document.getElementById('bookISBN').value;
            const publisher = document.getElementById('bookPublisher').value;
            const year = document.getElementById('bookYear').value;
            const quantity = document.getElementById('bookQuantity').value;
            const location = document.getElementById('bookLocation').value;
            
            if (!title) errors.push('Title is required');
            if (!author) errors.push('Author is required');
            if (!isbn) errors.push('ISBN is required');
            if (!publisher) errors.push('Publisher is required');
            if (!year) errors.push('Year is required');
            if (!quantity) errors.push('Quantity is required');
            if (!location) errors.push('Location is required');
            
            if (errors.length > 0) {
                showErrors('addBookErrors', errors);
                return;
            }
            
            booksDB.push({
                id: booksDB.length + 1,
                name: title,
                author: author,
                isbn: isbn,
                available: true,
                quantity: parseInt(quantity),
                publisher: publisher,
                year: parseInt(year),
                location: location
            });
            
            showSuccess('addBookSuccess', 'Book added successfully!');
            setTimeout(() => hideForms(), 2000);
        }
        
        function submitUserManagement(event) {
            event.preventDefault();
            const errors = [];
            const userType = document.querySelector('input[name="userType"]:checked').value;
            const name = document.getElementById('userName').value;
            
            if (!name) errors.push('Name is required');
            
            if (errors.length > 0) {
                showErrors('userMgmtErrors', errors);
                return;
            }
            
            showSuccess('userMgmtSuccess', `User ${userType === 'new' ? 'created' : 'updated'} successfully!`);
            setTimeout(() => hideForms(), 2000);
        }
        
        function submitAddMembership(event) {
            event.preventDefault();
            const errors = [];
            const name = document.getElementById('memberName').value;
            const email = document.getElementById('memberEmail').value;
            const phone = document.getElementById('memberPhone').value;
            const address = document.getElementById('memberAddress').value;
            
            if (!name) errors.push('Name is required');
            if (!email) errors.push('Email is required');
            if (!phone) errors.push('Phone is required');
            if (!address) errors.push('Address is required');
            
            if (errors.length > 0) {
                showErrors('addMemberErrors', errors);
                return;
            }
            
            const duration = document.querySelector('input[name="duration"]:checked').value;
            const expiryDate = new Date();
            if (duration === '6 months') expiryDate.setMonth(expiryDate.getMonth() + 6);
            else if (duration === '1 year') expiryDate.setFullYear(expiryDate.getFullYear() + 1);
            else expiryDate.setFullYear(expiryDate.getFullYear() + 2);
            
            membersDB.push({
                id: membersDB.length + 1,
                membershipNo: `M${1000 + membersDB.length + 1}`,
                name: name,
                email: email,
                phone: phone,
                address: address,
                plan: duration,
                expiryDate: expiryDate.toISOString().split('T')[0],
                active: true
            });
            
            showSuccess('addMemberSuccess', 'Membership added successfully!');
            setTimeout(() => hideForms(), 2000);
        }
        
        function submitUpdateMembership(event) {
            event.preventDefault();
            const membershipNo = document.getElementById('searchMemberNo').value;
            const action = document.querySelector('input[name="action"]:checked').value;
            
            if (!membershipNo) {
                showErrors('updateMemberErrors', ['Membership Number is required']);
                return;
            }
            
            const member = membersDB.find(m => m.membershipNo === membershipNo);
            if (!member) {
                showErrors('updateMemberErrors', ['Membership not found']);
                return;
            }
            
            if (action === 'extend') {
                const expiryDate = new Date(member.expiryDate);
                expiryDate.setMonth(expiryDate.getMonth() + 6);
                member.expiryDate = expiryDate.toISOString().split('T')[0];
                showSuccess('updateMemberSuccess', 'Membership extended by 6 months!');
            } else {
                member.active = false;
                showSuccess('updateMemberSuccess', 'Membership cancelled!');
            }
            
            setTimeout(() => hideForms(), 2000);
        }
        
        function submitIssueBook(event) {
            event.preventDefault();
            const errors = [];
            const bookName = document.getElementById('issueBookName').value;
            const issueDate = document.getElementById('issueDate').value;
            let returnDate = document.getElementById('returnDate').value;
            const bookAvailable = document.getElementById('bookAvailable').checked;
            const today = new Date().toISOString().split('T')[0];
            
            if (!bookName) errors.push('Book Name is required');
            if (!issueDate) errors.push('Issue Date is required');
            if (issueDate < today) errors.push('Issue Date cannot be earlier than today');
            if (!bookAvailable) errors.push('Book is not available');
            
            const autoReturnDate = new Date();
            autoReturnDate.setDate(autoReturnDate.getDate() + 15);
            const maxReturnDate = autoReturnDate.toISOString().split('T')[0];
            
            if (!returnDate) {
                returnDate = maxReturnDate;
                document.getElementById('returnDate').value = returnDate;
            }
            
            if (returnDate > maxReturnDate) {
                errors.push(`Return Date cannot be greater than 15 days from today (${maxReturnDate})`);
            }
            
            if (errors.length > 0) {
                showErrors('issueBookErrors', errors);
                return;
            }
            
            const book = booksDB.find(b => b.name === bookName);
            if (book) {
                book.available = false;
                book.quantity--;
            }
            
            transactionsDB.push({
                id: transactionsDB.length + 1,
                bookName: bookName,
                author: document.getElementById('issueAuthor').value,
                serialNo: `BK${String(transactionsDB.length + 1).padStart(3, '0')}`,
                issueDate: issueDate,
                returnDate: returnDate,
                actualReturnDate: null,
                fine: 0,
                finePaid: false,
                status: 'issued'
            });
            
            showSuccess('issueBookSuccess', 'Book issued successfully!');
            setTimeout(() => hideForms(), 2000);
        }
        
        function submitReturnBook(event) {
            event.preventDefault();
            const errors = [];
            const bookName = document.getElementById('returnBookName').value;
            const serialNo = document.getElementById('serialNo').value;
            
            if (!bookName) errors.push('Book Name is required');
            if (!serialNo) errors.push('Serial No is required');
            
            if (errors.length > 0) {
                showErrors('returnBookErrors', errors);
                return;
            }
            
            const transaction = transactionsDB.find(t => t.bookName === bookName && t.serialNo === serialNo && t.status === 'issued');
            if (transaction) {
                currentTransaction = transaction;
                document.getElementById('returnIssueDate').value = transaction.issueDate;
                document.getElementById('returnDateField').value = transaction.returnDate;
                showPayFine(transaction);
            } else {
                showErrors('returnBookErrors', ['Transaction not found']);
            }
        }
        
        function showPayFine(transaction) {
            const fine = calculateFine(transaction.issueDate, new Date().toISOString().split('T')[0]);
            transaction.fine = fine;
            
            document.getElementById('fineBookName').value = transaction.bookName;
            document.getElementById('fineAuthor').value = transaction.author;
            document.getElementById('fineSerialNo').value = transaction.serialNo;
            document.getElementById('fineIssueDate').value = transaction.issueDate;
            document.getElementById('fineReturnDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('fineAmount').value = fine > 0 ? `Rs. ${fine}` : 'No fine';
            
            document.getElementById('payFineForm').classList.add('active');
            document.getElementById('returnBookForm').classList.remove('active');
        }
        
        function calculateFine(issueDate, returnDate) {
            const issue = new Date(issueDate);
            const due = new Date(issue);
            due.setDate(due.getDate() + 15);
            const actual = new Date(returnDate);
            if (actual <= due) return 0;
            const daysLate = Math.ceil((actual - due) / (1000 * 60 * 60 * 24));
            return daysLate * 10;
        }
        
        function submitPayFine(event) {
            event.preventDefault();
            const errors = [];
            const fineAmount = currentTransaction.fine;
            const finePaid = document.getElementById('finePaid').checked;
            
            if (fineAmount > 0 && !finePaid) {
                errors.push('Fine Paid checkbox must be selected to complete return');
            }
            
            if (errors.length > 0) {
                showErrors('payFineErrors', errors);
                return;
            }
            
            currentTransaction.status = 'returned';
            currentTransaction.actualReturnDate = new Date().toISOString().split('T')[0];
            currentTransaction.finePaid = fineAmount > 0 ? finePaid : true;
            
            const book = booksDB.find(b => b.name === currentTransaction.bookName);
            if (book) {
                book.available = true;
                book.quantity++;
            }
            
            showSuccess('payFineSuccess', 'Book returned successfully!');
            setTimeout(() => hideForms(), 2000);
        }
        
        function showReports() {
            document.getElementById('formsContainer').innerHTML = '';
            const reportsContainer = document.getElementById('reportsContainer');
            reportsContainer.innerHTML = `
                <h3 class="form-title">Reports</h3>
                <div class="form-group">
                    <select id="reportType" onchange="loadReport()">
                        <option value="issued">Issued Books Report</option>
                        <option value="returned">Returned Books Report</option>
                        <option value="fines">Fines Collected Report</option>
                        <option value="members">Active Members Report</option>
                    </select>
                </div>
                <div id="reportContent"></div>
                <div class="form-actions"><button class="btn btn-secondary" onclick="hideForms()">Close</button></div>
            `;
            reportsContainer.classList.add('active');
            loadReport();
        }
        
        function loadReport() {
            const reportType = document.getElementById('reportType').value;
            const reportContent = document.getElementById('reportContent');
            
            if (reportType === 'issued') {
                const issued = transactionsDB.filter(t => t.status === 'issued');
                reportContent.innerHTML = generateReportTable(issued, ['Book Name', 'Author', 'Serial No', 'Issue Date', 'Return Date']);
            } else if (reportType === 'returned') {
                const returned = transactionsDB.filter(t => t.status === 'returned');
                reportContent.innerHTML = generateReportTable(returned, ['Book Name', 'Author', 'Serial No', 'Issue Date', 'Return Date', 'Actual Return Date', 'Fine']);
            } else if (reportType === 'fines') {
                const fines = transactionsDB.filter(t => t.fine > 0 && t.finePaid);
                reportContent.innerHTML = generateReportTable(fines, ['Book Name', 'Author', 'Fine', 'Paid']);
            } else if (reportType === 'members') {
                const activeMembers = membersDB.filter(m => m.active);
                reportContent.innerHTML = generateReportTable(activeMembers, ['Membership No', 'Name', 'Email', 'Plan', 'Expiry Date']);
            }
        }
        
        function generateReportTable(data, columns) {
            if (data.length === 0) return '<p>No data available</p>';
            let html = '<table class="report-table"><thead><tr>';
            columns.forEach(col => { html += `<th>${escapeHtml(col)}</th>`; });
            html += '</thead><tbody>';
            data.forEach(row => {
                html += '<tr>';
                columns.forEach(col => {
                    let key = col.toLowerCase().replace(/ /g, '');
                    let value = row[key];
                    const keyMap = { 'bookname':'bookName', 'serialno':'serialNo', 'issuedate':'issueDate', 'returndate':'returnDate', 'actualreturndate':'actualReturnDate', 'membershipno':'membershipNo', 'expirydate':'expiryDate' };
                    if (value === undefined && keyMap[key]) value = row[keyMap[key]];
                    if (col === 'Fine') value = `Rs. ${row.fine || 0}`;
                    if (col === 'Paid') value = row.finePaid ? 'Yes' : 'No';
                    html += `<td>${escapeHtml(String(value !== undefined && value !== null ? value : ''))}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            return html;
        }
        
        function autoPopulateAuthor() {
            const bookName = document.getElementById('issueBookName').value;
            const book = booksDB.find(b => b.name === bookName);
            if (book) {
                document.getElementById('issueAuthor').value = book.author;
                document.getElementById('bookAvailable').checked = book.available && book.quantity > 0;
            } else {
                document.getElementById('issueAuthor').value = '';
                document.getElementById('bookAvailable').checked = false;
            }
        }
        
        function autoPopulateReturnAuthor() {
            const bookName = document.getElementById('returnBookName').value;
            const transaction = transactionsDB.find(t => t.bookName === bookName && t.status === 'issued');
            if (transaction) {
                document.getElementById('returnAuthor').value = transaction.author;
                document.getElementById('serialNo').value = transaction.serialNo;
                document.getElementById('returnIssueDate').value = transaction.issueDate;
                document.getElementById('returnDateField').value = transaction.returnDate;
            } else {
                const book = booksDB.find(b => b.name === bookName);
                document.getElementById('returnAuthor').value = book ? book.author : '';
                document.getElementById('serialNo').value = '';
                document.getElementById('returnIssueDate').value = '';
                document.getElementById('returnDateField').value = '';
            }
        }
        
        function loadMemberDetails() {
            const membershipNo = document.getElementById('searchMemberNo').value;
            const member = membersDB.find(m => m.membershipNo === membershipNo);
            if (member) {
                document.getElementById('displayMemberName').value = member.name;
                document.getElementById('displayCurrentPlan').value = member.plan;
                document.getElementById('displayExpiryDate').value = member.expiryDate;
            } else {
                document.getElementById('displayMemberName').value = '';
                document.getElementById('displayCurrentPlan').value = '';
                document.getElementById('displayExpiryDate').value = '';
            }
        }
        
        function showErrors(elementId, errors) {
            const errorDiv = document.getElementById(elementId);
            if (!errorDiv) { console.error(`Error element "${elementId}" not found`); return; }
            const errorList = Array.isArray(errors) ? errors : [errors];
            errorDiv.innerHTML = `<ul>${errorList.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>`;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 3000);
        }
        
        function showSuccess(elementId, message) {
            const successDiv = document.getElementById(elementId);
            if (!successDiv) return;
            successDiv.innerHTML = escapeHtml(message);
            successDiv.classList.add('active');
            setTimeout(() => successDiv.classList.remove('active'), 3000);
        }
        
        function hideForms() {
            document.getElementById('formsContainer').innerHTML = '';
            document.getElementById('reportsContainer').classList.remove('active');
        }
        
        function showChart() {
            alert('📊 SYSTEM CHART\n\nLibrary Management System Flow:\n\nMAINTENANCE (Admin only)\n├── Add Book\n├── User Management\n├── Add Membership\n└── Update Membership\n\nREPORTS (All users)\n├── Issued Books\n├── Returned Books\n├── Fines Collected\n└── Active Members\n\nTRANSACTIONS (All users)\n├── Issue Book\n├── Return Book → Pay Fine\n└── Complete Return');
        }
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('change', function(e) {
                if (e.target && e.target.name === 'userType') {
                    const existingFields = document.getElementById('existingUserFields');
                    if (existingFields) existingFields.style.display = e.target.value === 'existing' ? 'block' : 'none';
                }
            });
        });
    </script>
</body>
